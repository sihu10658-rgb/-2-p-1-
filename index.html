<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <title>메르센 소수 찾기 · C++</title>
  <style>
    :root { color-scheme: dark; --bg:#101827; --panel:#192438; --line:#2c3b55; --text:#edf3ff; --muted:#a8b6cc; --accent:#7c9cff; --green:#77e0b5; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; padding:32px 16px; background:radial-gradient(ellipse at 50% -20%,#263a60 0,transparent 55%),var(--bg); color:var(--text); font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif; }
    main { width:min(760px,100%); margin:auto; }
    header { margin:18px 0 26px; }
    .eyebrow { color:var(--green); font-size:.8rem; font-weight:700; letter-spacing:.12em; }
    h1 { margin:.25rem 0; font-size:clamp(2rem,7vw,3rem); line-height:1.15; }
    .intro,.hint { color:var(--muted); }
    .card { padding:24px; border:1px solid var(--line); border-radius:18px; background:linear-gradient(145deg,#1c2940,#172235); box-shadow:0 18px 50px #0003; }
    label { display:block; margin-bottom:8px; font-weight:700; }
    .row { display:flex; gap:12px; align-items:stretch; }
    input { min-width:0; flex:1; padding:12px 14px; border:1px solid var(--line); border-radius:10px; background:#0f192a; color:var(--text); font:inherit; }
    button { padding:12px 18px; border:0; border-radius:10px; background:var(--accent); color:#101827; font:inherit; font-weight:800; cursor:pointer; }
    button:disabled { opacity:.55; cursor:wait; }
    .status { min-height:28px; margin:18px 0 8px; color:var(--green); font-weight:650; }
    .result { margin-top:12px; padding:16px; border:1px solid var(--line); border-radius:12px; background:#101a2a; }
    .result strong { color:var(--green); }
    .result code { display:block; overflow-wrap:anywhere; color:#d5e0f2; }
    .hint { margin:9px 0 0; font-size:.88rem; }
    .explain { margin-top:24px; padding:18px; border-left:3px solid var(--accent); background:#ffffff08; color:var(--muted); }
    .explain strong { color:var(--text); }
    @media(max-width:520px) { .card { padding:18px; } .row { flex-direction:column; } button { width:100%; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="eyebrow">C++ 계산 · WebAssembly · JavaScript 화면</div>
      <h1>메르센 소수 찾기</h1>
      <p class="intro">C++로 계산한 메르센 소수 <strong>Mₚ = 2ᵖ − 1</strong>를 찾아 보여 줍니다.</p>
    </header>
    <section class="card" aria-labelledby="search-title">
      <h2 id="search-title" style="margin-top:0">탐색 범위</h2>
      <label for="maxExponent">지수 p의 최댓값 (2–61)</label>
      <div class="row">
        <input id="maxExponent" type="number" min="2" max="61" value="31" inputmode="numeric">
        <button id="startButton" type="button">찾기 시작</button>
      </div>
      <p class="hint">버튼을 누르면 JavaScript가 WebAssembly로 빌드된 C++ 함수를 호출합니다.</p>
      <div id="status" class="status" role="status" aria-live="polite">C++ 모듈을 불러오는 중…</div>
      <div id="results" aria-live="polite"></div>
    </section>
    <aside class="explain"><strong>판정법</strong><br>소수 지수만 검사하고, 뤼카–레머 판정법으로 메르센 수가 소수인지 확인합니다. 이 예제는 64비트 정수 범위에 맞춰 지수 61까지 지원합니다. 먼저 README의 Emscripten 빌드 명령을 실행해 주세요.</aside>
  </main>
  <script type="module">
    const status = document.querySelector('#status');
    const results = document.querySelector('#results');
    const input = document.querySelector('#maxExponent');
    const button = document.querySelector('#startButton');
    let modulePromise;

    button.disabled = true;
    try {
      const { default: createMersenneModule } = await import('./mersenne.js');
      modulePromise = createMersenneModule();
      await modulePromise;
      status.textContent = '준비됐어요. 탐색을 시작해 보세요!';
      button.disabled = false;
    } catch (error) {
      status.textContent = 'C++ WebAssembly 모듈을 찾지 못했어요. README의 Emscripten 빌드 방법을 먼저 실행해 주세요.';
      console.error(error);
    }

    button.addEventListener('click', async () => {
      const limit = Number(input.value);
      if (!Number.isInteger(limit) || limit < 2 || limit > 61) {
        status.textContent = '2부터 61 사이의 정수를 입력해 주세요.';
        input.focus();
        return;
      }
      button.disabled = true;
      results.replaceChildren();
      status.textContent = 'C++에서 계산 중…';
      try {
        const module = await modulePromise;
        const pointer = module._find_mersenne_primes(limit);
        const text = module.UTF8ToString(pointer);
        if (!text) {
          status.textContent = '메르센 소수를 찾지 못했습니다.';
          return;
        }
        for (const line of text.split('\n')) {
          const [p, value] = line.split('|');
          const item = document.createElement('article');
          item.className = 'result';
          const heading = document.createElement('strong');
          heading.textContent = `M₍${p}₎ = 2^${p} − 1`;
          const number = document.createElement('code');
          number.textContent = value;
          item.append(heading, number);
          results.append(item);
        }
        status.textContent = '탐색 완료!';
      } catch (error) {
        status.textContent = `계산 중 오류가 발생했습니다: ${error.message}`;
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
